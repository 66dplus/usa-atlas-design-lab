name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node ux/check-flat-map.mjs
      - run: node ux/check-geometry.mjs
      - run: node ux/check-detail.mjs
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
