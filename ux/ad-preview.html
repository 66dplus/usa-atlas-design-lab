<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USA X-Ray advertisement preview</title><link rel="stylesheet" href="assets/fonts.css"><link rel="stylesheet" href="advertising/preview.css"></head><body data-device="desktop">
