name: usa-xray-analytics

services:
  umami:
    image: ghcr.io/umami-software/umami:3.4.1
    ports:
      - "127.0.0.1:4300:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?set UMAMI_APP_SECRET}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?set UMAMI_2FA_KEY}
      CLIENT_IP_HEADER: x-real-ip
      DISABLE_TELEMETRY: "1"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/heartbeat').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - analytics-private

  db:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:?set UMAMI_DB_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - analytics-db:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "umami", "-d", "umami"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - analytics-private

networks:
  # A normal bridge is needed for Docker 29 to publish Umami's loopback port.
  analytics-private: {}

volumes:
  analytics-db:
    name: usa-xray-analytics_analytics-db
