services:
  app:
    build:
      context: ../..
      dockerfile: deploy/mobile-preview/Dockerfile
    user: "${ATLAS_PREVIEW_UID:?set ATLAS_PREVIEW_UID}:${ATLAS_PREVIEW_GID:?set ATLAS_PREVIEW_GID}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    volumes:
      - type: bind
        source: ${ATLAS_READER_PASSWORD_FILE:?set ATLAS_READER_PASSWORD_FILE}
        target: /run/secrets/usa_atlas_reader_password
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    restart: unless-stopped
    networks:
      - preview
      - database

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    user: "65532:65532"
    read_only: true
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --url
      - http://app:4180
      - --http-host-header
      - 127.0.0.1:4180
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - preview

networks:
  preview: {}
  database:
    external: true
    name: usa-atlas-private
